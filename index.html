<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhyme Lab | Gothica Future Tech</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Rhyme Lab</h1>
      <button class="sidebar-close-btn" onclick="document.querySelector('.sidebar').classList.remove('open')">&times;</button>
    </div>
    
    <div class="sidebar-section">
      <h2>STRICTNESS: <span id="strictness-label">CLOSE</span></h2>
      <div class="control-group">
        <input type="range" id="strictness-slider" class="slider" min="0" max="3" value="1">
        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">
          <span>EXACT</span>
          <span>CLOSE</span>
          <span>SLANT</span>
          <span>EXP</span>
        </div>
      </div>
      <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="syllable-lock" onchange="toggleSyllableLock()" style="accent-color: var(--accent); width: 15px; height: 15px;">
        <label for="syllable-lock" style="font-size: 0.8rem; color: var(--accent); font-family: var(--font-glitch); letter-spacing: 1px; cursor: pointer;">SYLLABLE LOCK</label>
      </div>
    </div>
    
    <div class="sidebar-section">
      <h2>VOCAB MODE</h2>
      <div style="display: flex; gap: 5px; margin-top: 10px; margin-bottom: 25px;">
        <button id="mode-simple" class="btn-secondary" onclick="setVocabMode('simple')" style="flex:1; padding:8px 0; font-size:0.8rem;">SIMPLE</button>
        <button id="mode-normal" class="btn-primary" onclick="setVocabMode('normal')" style="flex:1; padding:8px 0; font-size:0.8rem;">NORMAL</button>
        <button id="mode-tuff" class="btn-secondary" onclick="setVocabMode('tuff')" style="flex:1; padding:8px 0; font-size:0.8rem;">TUFF</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>CIPHER PROTOCOL</h2>
      <div class="control-group">
        <button id="cipher-toggle" class="btn-secondary" onclick="toggleCipher()" style="font-size:1.2rem; font-family: var(--font-glitch); letter-spacing:2px; padding: 12px;">OFF</button>
      </div>
      <p style="font-size: 0.75rem; color: var(--text-muted); text-align: center;">Automatically cyles unmatched rhymes beneath anchors.</p>
    </div>
    
    <div class="sidebar-section">
      <h2>DATABASE</h2>
      <button class="btn-primary" onclick="openDictionary()">ACCESS ALL WORDS</button>
    </div>
    
    <div class="sidebar-section">
      <h2>VAULT</h2>
      <div id="fav-list" class="word-list">
        <!-- Favorites injected here -->
      </div>
    </div>
    
    <div class="sidebar-section" style="border-bottom: none;">
      <h2>INJECT CUSTOM</h2>
      <div class="custom-word-input">
        <input type="text" id="custom-word-input" placeholder="Type..." onkeydown="if(event.key === 'Enter') addCustomWord()">
        <button onclick="addCustomWord()">+</button>
      </div>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="main-content">
    
    <div class="topbar">
      <div class="roll-controls">
        <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.add('open')">☰ MENU</button>
        <button class="roll-btn" onclick="randomizeBoard()">ROLL</button>
        <button class="roll-btn" onclick="undoRoll()" style="font-size: 1rem; padding: 10px 20px; box-shadow: 2px 2px 0 var(--accent);">UNDO</button>
        <button class="roll-btn" onclick="refreshRhymes()" style="font-size: 1rem; padding: 10px 20px; box-shadow: 2px 2px 0 var(--accent);">SHUFFLE</button>
        <label class="roll-btn" style="font-size: 1rem; padding: 10px 20px; box-shadow: 2px 2px 0 var(--accent); cursor: pointer; margin: 0;">
          COLOR
          <input type="color" value="#d9042b" style="opacity: 0; width: 0; height: 0; border: none; padding: 0; position: absolute;" oninput="changeThemeColor(this.value)">
        </label>
        <button class="roll-btn" onclick="document.getElementById('rhyme-pad').classList.toggle('open')" style="font-size: 1rem; padding: 10px 20px; box-shadow: 2px 2px 0 var(--accent);">PAD</button>
        <select id="anchor-count" class="mode-select" onchange="setAnchorCount(this.value)">
          <option value="2">2 Anchors</option>
          <option value="3">3 Anchors</option>
          <option value="4">4 Anchors</option>
          <option value="5" selected>5 Anchors</option>
          <option value="6">6 Anchors</option>
          <option value="7">7 Anchors</option>
          <option value="8">8 Anchors</option>
        </select>
      </div>
      
      <div class="beat-controls" style="display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.05); padding: 5px 15px; border: 1px solid var(--border-color);">
        <label style="font-size: 0.8rem; color: var(--text-muted);">BPM</label>
        <input type="number" id="bpm-input" value="142" style="width: 50px; background: transparent; color: var(--accent); font-weight:bold; font-family:var(--font-main); border:none; outline:none;">
        
        <label style="font-size: 0.8rem; color: var(--text-muted); margin-left: 5px;">TIME</label>
        <select id="bar-speed-input" style="background: transparent; color: var(--accent); font-weight:bold; font-family:var(--font-main); border: none; outline: none; cursor: pointer;">
          <option value="0.5" style="background: #111; color: #fff;">½ Bar</option>
          <option value="1" style="background: #111; color: #fff;">1 Bar</option>
          <option value="2" selected style="background: #111; color: #fff;">2 Bars</option>
          <option value="4" style="background: #111; color: #fff;">4 Bars</option>
        </select>

        <button id="beat-btn" class="btn-primary" onclick="toggleBeat()" style="padding: 5px 15px; clip-path: none; letter-spacing: 1px;">BEAT</button>
        <button id="auto-roll-btn" class="btn-primary" onclick="toggleAutoRoll()" style="padding: 5px 15px; clip-path: none; letter-spacing: 1px;">AUTO-ROLL</button>
      </div>
    </div>
    
    <!-- ANCHOR BOARD -->
    <div id="board" class="rhyme-board">
      <!-- Generated by JS -->
    </div>
    
  </main>

  <!-- RHYME PAD -->
  <aside id="rhyme-pad" class="rhyme-pad">
    <div class="pad-content-wrapper">
      <div class="pad-header">
        <h2>RHYME PAD</h2>
        <button class="pad-close" onclick="document.getElementById('rhyme-pad').classList.remove('open')">&times;</button>
      </div>
      <div class="pad-body" contenteditable="true" spellcheck="false" placeholder="Drag rhymes here or type...&#10;&#10;e.g.&#10;I got the WEALTH&#10;And the STEALTH"></div>
    </div>
  </aside>

  <!-- DICTIONARY MODAL -->
  <div id="dict-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>GLOBAL DICTIONARY</h2>
        <button class="modal-close" onclick="closeDictionary()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" class="dict-search" placeholder="Query database..." oninput="renderDictionary(this.value)">
        <div id="dict-grid" class="dict-grid">
          <!-- Generated by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="families.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.error('SW init failed:', err));
      });
    }
  </script>
</body>
</html>
